services:
  - type: web
    name: healthguardian-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && gunicorn -c gunicorn.conf.py app.main:app"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # set manually to your Neon connection string
      - key: BACKEND_CORS_ORIGINS
        sync: false # set to your Vercel frontend URL
      - key: REDIS_URL
        sync: false # optional — Render Redis add-on or external Upstash/Redis Cloud URL
      - key: OPENAI_API_KEY
        sync: false # optional
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # optional
      - key: CLOUDINARY_API_KEY
        sync: false # optional
      - key: CLOUDINARY_API_SECRET
        sync: false # optional
